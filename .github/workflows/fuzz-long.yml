name: fuzz-long

# The one-hour parser fuzz run required by the acceptance criteria (requirements 12). The 5-minute
# smoke run in ci.yml guards every push; this one runs weekly and on demand.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz the parser for one hour
        working-directory: fuzz
        run: cargo +nightly fuzz run parse -- -max_total_time=3600
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
