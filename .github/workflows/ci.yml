name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # The corpus job (milestone M5+) also runs here; Windows x86_64 is the release target.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Solver speed target (release build)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p tcad-solver -p tcad-model --test solver --test corpus
      - name: Spec examples and corpus are in canonical form
        run: cargo run -p tcad-cli -- fmt --check spec/examples corpus

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      # The workflow-wide -D warnings must not reach the instrumented fuzz build.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz the parser for 5 minutes
        working-directory: fuzz
        # rust-toolchain.toml pins stable, so nightly must be selected explicitly.
        run: cargo +nightly fuzz run parse -- -max_total_time=300

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM-capable crates
        run: >
          cargo build --target wasm32-unknown-unknown
          -p tcad-diag -p tcad-syntax -p tcad-expr -p tcad-model -p tcad-solver
          -p tcad-naming -p tcad-kernel -p tcad-cache

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          missing=$(git log --format='%H' --no-merges \
            "origin/${{ github.base_ref }}..HEAD" |
            while read -r sha; do
              git show -s --format=%B "$sha" | grep -q '^Signed-off-by: ' || echo "$sha"
            done)
          if [ -n "$missing" ]; then
            echo "Commits missing a DCO sign-off (use git commit -s):"; echo "$missing"; exit 1
          fi
