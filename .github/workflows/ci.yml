name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # The corpus job (milestone M5+) also runs here; Windows x86_64 is the release target.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Solver speed target (release build)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p tcad-solver -p tcad-model --test solver --test corpus
      - name: Spec examples and corpus are in canonical form
        run: cargo run -p tcad-cli -- fmt --check spec/examples corpus

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      # The workflow-wide -D warnings must not reach the instrumented fuzz build.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz the parser for 5 minutes
        working-directory: fuzz
        # rust-toolchain.toml pins stable, so nightly must be selected explicitly.
        run: cargo +nightly fuzz run parse -- -max_total_time=300

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM-capable crates
        run: >
          cargo build --target wasm32-unknown-unknown
          -p tcad-diag -p tcad-syntax -p tcad-expr -p tcad-model -p tcad-solver
          -p tcad-naming -p tcad-kernel -p tcad-cache -p tcad-io -p tcad-lsp

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          missing=$(git log --format='%H' --no-merges \
            "origin/${{ github.base_ref }}..HEAD" |
            while read -r sha; do
              git show -s --format=%B "$sha" | grep -q '^Signed-off-by: ' || echo "$sha"
            done)
          if [ -n "$missing" ]; then
            echo "Commits missing a DCO sign-off (use git commit -s):"; echo "$missing"; exit 1
          fi

  occt-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      # OpenCASCADE 8.0.1 from conda-forge: the version the Windows job uses, so both check the
      # same canonical B-rep hashes (corpus/brep-t1.txt, docs/adr/0014).
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: occt
          create-args: occt=8.0.1
          cache-environment: true
          # the second micromamba step below cleans up the shell; a second cleanup fails
          post-cleanup: none
      - name: Point the build at OpenCASCADE 8.0.1
        run: |
          echo "OCCT_INCLUDE_DIR=$MAMBA_ROOT_PREFIX/envs/occt/include/opencascade" >> "$GITHUB_ENV"
          echo "OCCT_LIB_DIR=$MAMBA_ROOT_PREFIX/envs/occt/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$MAMBA_ROOT_PREFIX/envs/occt/lib" >> "$GITHUB_ENV"
          echo "BREP_T1_DUMP=$RUNNER_TEMP/brep-linux" >> "$GITHUB_ENV"
      - name: Test with OCCT
        run: cargo test --workspace --features tcad-cli/occt,tcad-build/occt,tcad-mcp/occt
      - name: Keep the canonical B-reps (compare platforms line by line)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brep-linux
          path: ${{ runner.temp }}/brep-linux
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read every corpus STEP export with an independent reader
        run: |
          pip install build123d
          cargo build -p tcad-cli --features occt
          python3 corpus/tools/check_step_exports.py target/debug/tcad corpus
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: freecad
          create-args: freecad
          cache-environment: true
      - name: Open the hydraulic STEP exports in FreeCAD
        shell: bash -el {0}
        run: |
          mkdir -p "$RUNNER_TEMP/step"
          for d in corpus/hyd_*/; do
            n=$(basename "$d")
            target/debug/tcad export --to step --out "$RUNNER_TEMP/step/$n.step" "$d"
          done
          STEP_DIR="$RUNNER_TEMP/step" CORPUS_DIR="$PWD/corpus" freecadcmd corpus/tools/check_freecad.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Viewer (typecheck, bundle is current, browser test)
        working-directory: viewer
        run: |
          npm ci
          npm run check
          npm run build
          git diff --exit-code -- ../crates/tcad-cli/assets/viewer.js
          npx playwright-core install --with-deps chromium
          TCAD="$GITHUB_WORKSPACE/target/debug/tcad" npm test

  # The non-geometry crates run on WebAssembly (WASI) and must reproduce the digests in
  # corpus/determinism.txt bit for bit, as the Windows and Linux test jobs do.
  wasm-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install wasmtime
      - name: Test the non-geometry crates under WASI
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: python3 ${{ github.workspace }}/corpus/tools/wasi_run.py
        run: cargo test --target wasm32-wasip1 -p tcad-diag -p tcad-syntax -p tcad-expr -p tcad-solver -p tcad-model

  # The VS Code / Theia extension must compile and bundle.
  editors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p tcad-lsp
      - name: Compile, bundle, and run the language server inside VS Code
        working-directory: editors/vscode
        run: |
          npm ci
          npm run check
          npm run build
          TCAD_LSP="$GITHUB_WORKSPACE/target/debug/tcad-lsp" xvfb-run -a npm test
      - name: Run the extension and its language server inside Eclipse Theia
        working-directory: editors/theia-test
        run: |
          npm ci
          npm run build
          npx playwright-core install --with-deps chromium
          TCAD_LSP="$GITHUB_WORKSPACE/target/debug/tcad-lsp" npm test

  # Phase 1b (docs/adr/0014): the build in WebAssembly with OpenCASCADE 8.0.1 as a side module.
  # Gate: every measured corpus part regenerates with the canonical B-rep hash of the native builds.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      # The official emsdk: its LLVM and binaryen are released together (conda-forge's emscripten
      # 4.0.9 pairs with binaryen 117, which rejects the features that emcc passes to wasm-opt).
      - name: Emscripten 4.0.9
        run: |
          git clone --depth 1 --branch 4.0.9 https://github.com/emscripten-core/emsdk "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.9
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.9
          sudo apt-get install -y ninja-build
      - name: Restore OpenCASCADE for WebAssembly
        id: occt-wasm
        uses: actions/cache/restore@v4
        with:
          path: occt-wasm
          key: occt-wasm-8.0.1-emsdk-4.0.9-${{ hashFiles('tools/wasm/build-occt.sh') }}
      - name: Build OpenCASCADE for WebAssembly
        if: steps.occt-wasm.outputs.cache-hit != 'true'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          tools/wasm/build-occt.sh occt-wasm
      - name: Save OpenCASCADE for WebAssembly
        if: steps.occt-wasm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: occt-wasm
          key: ${{ steps.occt-wasm.outputs.cache-primary-key }}
      - name: Build the browser module
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          tools/wasm/link-occt.sh occt-wasm
          export OCCT_INCLUDE_DIR="$PWD/occt-wasm/include/opencascade"
          export TCAD_OCCT_WASM="$PWD/occt-wasm/occt.wasm"
          cargo build --release -p tcad-web --features occt --target wasm32-unknown-emscripten
          cp occt-wasm/occt.wasm target/wasm32-unknown-emscripten/release/
          ls -la target/wasm32-unknown-emscripten/release/ | grep -E 'tcad|occt'
      - name: Regenerate the corpus in WebAssembly (T1 against the native builds)
        run: node tools/wasm/gate.mjs target/wasm32-unknown-emscripten/release/tcad-web.js corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: In-browser viewer (edit, regenerate, highlight) in Chromium
        run: |
          (cd viewer && npm ci && npm run build)
          tools/wasm/site.sh target/wasm32-unknown-emscripten/release site
          (cd viewer && npx playwright-core install --with-deps chromium && node tests/browser.test.mjs ../site)

  build123d-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build123d
      - run: python3 corpus/tools/compare_reference.py corpus

  # The same tests as occt-linux, on Windows with OpenCASCADE from vcpkg (cached). Windows is the
  # primary platform: every corpus part must build here and match expected.json.
  # Where the canonical B-reps of two platforms differ (docs/adr/0014), line by line.
  brep-compare:
    needs: [occt-linux, occt-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: breps
      - run: python3 tools/brep-diff.py breps/brep-windows breps/brep-linux

  occt-windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Restore OpenCASCADE
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_installed
          key: occt-vcpkg-x64-windows-v1
      - name: Install OpenCASCADE
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: vcpkg install "opencascade[core]:x64-windows" --x-install-root="$env:GITHUB_WORKSPACE\vcpkg_installed"
      # Saved right after the (very long) build, so a failing test run does not throw it away.
      - name: Save OpenCASCADE
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg_installed
          key: occt-vcpkg-x64-windows-v1
      - name: Test with OCCT
        shell: pwsh
        timeout-minutes: 40
        run: |
          $root = "$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows"
          Get-ChildItem "$root\lib" -Filter "TK*STEP*.lib" | ForEach-Object { $_.Name }
          Get-ChildItem "$root\lib" -Filter "TK*DE*.lib" | ForEach-Object { $_.Name }
          $env:OCCT_INCLUDE_DIR = "$root\include\opencascade"
          $env:OCCT_LIB_DIR = "$root\lib"
          $env:PATH = "$root\bin;$env:PATH"
          $env:BREP_T1_DUMP = "$env:RUNNER_TEMP\brep-windows"
          cargo test --workspace --features tcad-cli/occt,tcad-build/occt,tcad-mcp/occt
      - name: Keep the canonical B-reps (compare platforms line by line)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brep-windows
          path: ${{ runner.temp }}/brep-windows
          if-no-files-found: ignore
