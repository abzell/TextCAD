[package]
name = "tcad-mcp"
description = "MCP server for agents: create, edit, build and inspect TextCAD parts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tcad-mcp"
path = "src/main.rs"

[dependencies]
tcad-build.workspace = true
tcad-cache.workspace = true
tcad-cli.workspace = true
tcad-diag.workspace = true
tcad-expr.workspace = true
tcad-io.workspace = true
tcad-kernel.workspace = true
tcad-model.workspace = true
tcad-syntax.workspace = true
tcad-occt = { workspace = true, optional = true }
serde_json = "1"

[features]
# Link the OpenCASCADE geometry kernel (needed for everything that builds geometry).
occt = ["dep:tcad-occt", "tcad-occt/occt", "tcad-cli/occt"]

[lints]
workspace = true
