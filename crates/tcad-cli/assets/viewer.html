<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TextCAD viewer</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1f24; --panel:#f3f5f8; --line:#d0d7de; --sel:#fff1c9; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --fg:#d7dde5; --panel:#1b2027; --line:#323a45; --sel:#4a3d12; --accent:#58a6ff; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui, sans-serif; }
  #app { display:grid; grid-template-columns: 300px minmax(280px, 1fr) 2fr; grid-template-rows: auto 1fr auto; height:100%; }
  header { grid-column: 1 / 4; display:flex; gap:8px; align-items:center; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); }
  header strong { margin-right:8px; }
  select { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:2px 4px; max-width:320px; }
  #banner { grid-column: 1 / 4; margin:0; padding:6px 10px; background:#fde8e8; color:#8a1f1f; white-space:pre-wrap; font:12px ui-monospace, monospace; }
  #left, #right { overflow:auto; border-right:1px solid var(--line); min-height:0; }
  #tree { list-style:none; margin:0; padding:4px 0; }
  #tree li { padding:3px 10px; cursor:pointer; white-space:nowrap; }
  #tree li:hover { background:var(--panel); }
  #tree li.sel, .line.sel { background:var(--sel); }
  #source { font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding:4px 0; }
  .line { white-space:pre; padding:0 10px; }
  .line.feature { cursor:pointer; }
  .line.feature:hover { background:var(--panel); }
  #stage { position:relative; min-height:0; }
  #view { position:absolute; inset:0; width:100%; height:100%; display:block; outline:none; }
  footer { grid-column: 1 / 4; padding:4px 10px; background:var(--panel); border-top:1px solid var(--line); min-height:26px; font-family:ui-monospace, monospace; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <strong>TextCAD</strong>
    <select id="part" aria-label="Part"></select>
    <select id="config" aria-label="Configuration" hidden></select>
  </header>
  <pre id="banner" hidden></pre>
  <div id="left"><ul id="tree" aria-label="Feature tree"></ul></div>
  <div id="right"><div id="source" aria-label="Source"></div></div>
  <div id="stage"><canvas id="view" tabindex="0"></canvas></div>
  <footer id="status"></footer>
</div>
<script src="/viewer.js"></script>
</body>
</html>
