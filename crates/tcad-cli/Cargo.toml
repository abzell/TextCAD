[package]
name = "tcad-cli"
description = "The tcad command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tcad"
path = "src/main.rs"

[dependencies]
tcad-diag.workspace = true
tcad-syntax.workspace = true
tcad-model.workspace = true
tcad-build.workspace = true
tcad-kernel.workspace = true
tcad-cache.workspace = true
tcad-occt = { workspace = true, optional = true }
serde_json = "1"

[features]
# Link the OpenCASCADE geometry kernel (needed for `build` and `props`).
occt = ["dep:tcad-occt", "tcad-occt/occt"]

[lints]
workspace = true
